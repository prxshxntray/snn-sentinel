name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch
        run: python -m pip install --upgrade pip && python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Pytest
        run: pytest -q
      - name: Smoke test
        run: python scripts/smoke_test.py
